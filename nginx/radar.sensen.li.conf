# /etc/nginx/conf.d/radar.sensen.li.conf
# Nginx 反向代理配置 - 宽基资金脉搏 & 国家队异动雷达
# 由 443 端口 SNI 路由转发至本机 8043，再代理至 Docker 容器端口 8765

# HTTP 自动重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name radar.sensen.li;
    port_in_redirect off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务配置（SNI 8043 端口）
server {
    listen 8043 ssl;
    listen [::]:8043 ssl;
    http2 on;
    server_name radar.sensen.li;
    port_in_redirect off;

    # 通配符 SSL 证书
    ssl_certificate     /etc/certs/sensen.li/fullchain.cer;
    ssl_certificate_key /etc/certs/sensen.li/sensen.li.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header          Strict-Transport-Security "max-age=31536000" always;

    # Gzip 压缩支持（优化前端加载速度）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8765;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE 长连接流式支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 流式传输不启用缓冲区，防止推送延迟
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
