# /etc/nginx/conf.d/radar.sensen.li.conf
# Nginx 反向代理配置 - 宽基资金脉搏 & 国家队异动雷达

# HTTP 自动重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name radar.sensen.li;

    # Let's Encrypt 证书验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radar.sensen.li;

    # SSL 证书路径（使用 Certbot 生成后自动填入或手动指定）
    # ssl_certificate /etc/letsencrypt/live/radar.sensen.li/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/radar.sensen.li/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip 压缩支持（优化前端加载速度）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8765;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE 长连接支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 流式传输不启用缓冲区，防止推送延迟
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
